<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" role="img" aria-label="Healthy glowing skin">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#f0dcc8" />
      <stop offset="55%" stop-color="#e2bfa2" />
      <stop offset="100%" stop-color="#c99a79" />
    </linearGradient>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="64" />
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="6852" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer><feFuncA type="linear" slope="0.09" /></feComponentTransfer>
    </filter>
  </defs>
  <rect width="900" height="700" fill="url(#base)" />
  <g filter="url(#soften)">
      <circle cx="202" cy="362" r="385" fill="#f0dcc8" opacity="0.26" />
      <circle cx="898" cy="246" r="391" fill="#e2bfa2" opacity="0.39" />
      <circle cx="755" cy="98" r="464" fill="#c99a79" opacity="0.54" />
      <circle cx="86" cy="585" r="311" fill="#f0dcc8" opacity="0.54" />
      <circle cx="443" cy="291" r="287" fill="#e2bfa2" opacity="0.65" />
  </g>
  <rect width="900" height="700" filter="url(#grain)" />
  <rect width="900" height="700" fill="#22261b" opacity="0.04" />
</svg>
