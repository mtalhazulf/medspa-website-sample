<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-label="Laser micropeel session">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#f3e3d8" />
      <stop offset="55%" stop-color="#dcbfae" />
      <stop offset="100%" stop-color="#b08d78" />
    </linearGradient>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="57" />
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="3921" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer><feFuncA type="linear" slope="0.09" /></feComponentTransfer>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#base)" />
  <g filter="url(#soften)">
      <circle cx="688" cy="220" r="564" fill="#f3e3d8" opacity="0.32" />
      <circle cx="785" cy="149" r="581" fill="#dcbfae" opacity="0.32" />
      <circle cx="94" cy="337" r="493" fill="#b08d78" opacity="0.44" />
      <circle cx="148" cy="290" r="421" fill="#f3e3d8" opacity="0.45" />
      <circle cx="21" cy="455" r="508" fill="#dcbfae" opacity="0.42" />
  </g>
  <rect width="800" height="800" filter="url(#grain)" />
  <rect width="800" height="800" fill="#22261b" opacity="0.04" />
</svg>
