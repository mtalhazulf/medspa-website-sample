<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1000" viewBox="0 0 900 1000" role="img" aria-label="Skin before treatment">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#f3e3d8" />
      <stop offset="55%" stop-color="#dcbfae" />
      <stop offset="100%" stop-color="#b08d78" />
    </linearGradient>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="71" />
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="8806" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer><feFuncA type="linear" slope="0.09" /></feComponentTransfer>
    </filter>
  </defs>
  <rect width="900" height="1000" fill="url(#base)" />
  <g filter="url(#soften)">
      <circle cx="878" cy="131" r="334" fill="#f3e3d8" opacity="0.57" />
      <circle cx="338" cy="846" r="481" fill="#dcbfae" opacity="0.46" />
      <circle cx="645" cy="482" r="733" fill="#b08d78" opacity="0.62" />
      <circle cx="897" cy="980" r="460" fill="#f3e3d8" opacity="0.63" />
      <circle cx="490" cy="156" r="384" fill="#dcbfae" opacity="0.60" />
  </g>
  <rect width="900" height="1000" filter="url(#grain)" />
  <rect width="900" height="1000" fill="#22261b" opacity="0.04" />
</svg>
