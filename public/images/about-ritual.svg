<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-label="Practitioner preparing a treatment">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#f6f1e4" />
      <stop offset="55%" stop-color="#e7ded0" />
      <stop offset="100%" stop-color="#cfc7b6" />
    </linearGradient>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="43" />
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="990" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer><feFuncA type="linear" slope="0.09" /></feComponentTransfer>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#base)" />
  <g filter="url(#soften)">
      <circle cx="480" cy="381" r="251" fill="#f6f1e4" opacity="0.29" />
      <circle cx="339" cy="337" r="303" fill="#e7ded0" opacity="0.54" />
      <circle cx="562" cy="422" r="332" fill="#cfc7b6" opacity="0.50" />
      <circle cx="94" cy="215" r="432" fill="#f6f1e4" opacity="0.62" />
      <circle cx="120" cy="522" r="403" fill="#e7ded0" opacity="0.50" />
  </g>
  <rect width="600" height="600" filter="url(#grain)" />
  <rect width="600" height="600" fill="#22261b" opacity="0.04" />
</svg>
