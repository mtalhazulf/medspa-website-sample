<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-label="Treatment room at Lumiére">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#eef2e6" />
      <stop offset="55%" stop-color="#d9e2cf" />
      <stop offset="100%" stop-color="#b4c1a5" />
    </linearGradient>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="100" />
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="10760" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer><feFuncA type="linear" slope="0.09" /></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1400" height="900" fill="url(#base)" />
  <g filter="url(#soften)">
      <circle cx="1114" cy="12" r="604" fill="#eef2e6" opacity="0.65" />
      <circle cx="1095" cy="346" r="958" fill="#d9e2cf" opacity="0.48" />
      <circle cx="1151" cy="27" r="734" fill="#b4c1a5" opacity="0.53" />
      <circle cx="114" cy="205" r="878" fill="#eef2e6" opacity="0.50" />
      <circle cx="46" cy="357" r="878" fill="#d9e2cf" opacity="0.61" />
  </g>
  <rect width="1400" height="900" filter="url(#grain)" />
  <rect width="1400" height="900" fill="#22261b" opacity="0.04" />
</svg>
