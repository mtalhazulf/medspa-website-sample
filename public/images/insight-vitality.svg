<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" role="img" aria-label="Skin vitality serum">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#f6f1e4" />
      <stop offset="55%" stop-color="#e7ded0" />
      <stop offset="100%" stop-color="#cfc7b6" />
    </linearGradient>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="64" />
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7829" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer><feFuncA type="linear" slope="0.09" /></feComponentTransfer>
    </filter>
  </defs>
  <rect width="900" height="700" fill="url(#base)" />
  <g filter="url(#soften)">
      <circle cx="684" cy="152" r="608" fill="#f6f1e4" opacity="0.43" />
      <circle cx="203" cy="446" r="571" fill="#e7ded0" opacity="0.32" />
      <circle cx="80" cy="402" r="592" fill="#cfc7b6" opacity="0.33" />
      <circle cx="602" cy="261" r="491" fill="#f6f1e4" opacity="0.40" />
      <circle cx="695" cy="299" r="360" fill="#e7ded0" opacity="0.48" />
  </g>
  <rect width="900" height="700" filter="url(#grain)" />
  <rect width="900" height="700" fill="#22261b" opacity="0.04" />
</svg>
