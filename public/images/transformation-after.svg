<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1000" viewBox="0 0 900 1000" role="img" aria-label="Skin after treatment">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#f0dcc8" />
      <stop offset="55%" stop-color="#e2bfa2" />
      <stop offset="100%" stop-color="#c99a79" />
    </linearGradient>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="71" />
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="9783" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer><feFuncA type="linear" slope="0.09" /></feComponentTransfer>
    </filter>
  </defs>
  <rect width="900" height="1000" fill="url(#base)" />
  <g filter="url(#soften)">
      <circle cx="564" cy="764" r="625" fill="#f0dcc8" opacity="0.65" />
      <circle cx="235" cy="732" r="591" fill="#e2bfa2" opacity="0.28" />
      <circle cx="175" cy="528" r="722" fill="#c99a79" opacity="0.60" />
      <circle cx="263" cy="690" r="732" fill="#f0dcc8" opacity="0.61" />
      <circle cx="364" cy="489" r="717" fill="#e2bfa2" opacity="0.43" />
  </g>
  <rect width="900" height="1000" filter="url(#grain)" />
  <rect width="900" height="1000" fill="#22261b" opacity="0.04" />
</svg>
