<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="Client portrait">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#f3e3d8" />
      <stop offset="55%" stop-color="#dcbfae" />
      <stop offset="100%" stop-color="#b08d78" />
    </linearGradient>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" />
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="12714" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer><feFuncA type="linear" slope="0.09" /></feComponentTransfer>
    </filter>
  </defs>
  <rect width="120" height="120" fill="url(#base)" />
  <g filter="url(#soften)">
      <circle cx="30" cy="16" r="56" fill="#f3e3d8" opacity="0.27" />
      <circle cx="112" cy="7" r="59" fill="#dcbfae" opacity="0.36" />
      <circle cx="40" cy="14" r="88" fill="#b08d78" opacity="0.25" />
      <circle cx="59" cy="35" r="86" fill="#f3e3d8" opacity="0.42" />
      <circle cx="3" cy="69" r="43" fill="#dcbfae" opacity="0.64" />
  </g>
  <rect width="120" height="120" filter="url(#grain)" />
  <rect width="120" height="120" fill="#22261b" opacity="0.04" />
</svg>
