<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="Client portrait">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#f0dcc8" />
      <stop offset="55%" stop-color="#e2bfa2" />
      <stop offset="100%" stop-color="#c99a79" />
    </linearGradient>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" />
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="11737" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer><feFuncA type="linear" slope="0.09" /></feComponentTransfer>
    </filter>
  </defs>
  <rect width="120" height="120" fill="url(#base)" />
  <g filter="url(#soften)">
      <circle cx="69" cy="27" r="60" fill="#f0dcc8" opacity="0.65" />
      <circle cx="30" cy="27" r="74" fill="#e2bfa2" opacity="0.36" />
      <circle cx="118" cy="110" r="82" fill="#c99a79" opacity="0.53" />
      <circle cx="78" cy="64" r="66" fill="#f0dcc8" opacity="0.26" />
      <circle cx="96" cy="47" r="44" fill="#e2bfa2" opacity="0.59" />
  </g>
  <rect width="120" height="120" filter="url(#grain)" />
  <rect width="120" height="120" fill="#22261b" opacity="0.04" />
</svg>
