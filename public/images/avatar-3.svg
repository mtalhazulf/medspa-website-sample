<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="Client portrait">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#f6f1e4" />
      <stop offset="55%" stop-color="#e7ded0" />
      <stop offset="100%" stop-color="#cfc7b6" />
    </linearGradient>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" />
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="13691" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer><feFuncA type="linear" slope="0.09" /></feComponentTransfer>
    </filter>
  </defs>
  <rect width="120" height="120" fill="url(#base)" />
  <g filter="url(#soften)">
      <circle cx="17" cy="61" r="40" fill="#f6f1e4" opacity="0.37" />
      <circle cx="56" cy="1" r="88" fill="#e7ded0" opacity="0.61" />
      <circle cx="90" cy="40" r="59" fill="#cfc7b6" opacity="0.62" />
      <circle cx="75" cy="82" r="77" fill="#f6f1e4" opacity="0.35" />
      <circle cx="84" cy="96" r="54" fill="#e7ded0" opacity="0.56" />
  </g>
  <rect width="120" height="120" filter="url(#grain)" />
  <rect width="120" height="120" fill="#22261b" opacity="0.04" />
</svg>
