<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-label="Hydrating sheet mask">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#e9f0c6" />
      <stop offset="55%" stop-color="#cfdc9c" />
      <stop offset="100%" stop-color="#9fb06d" />
    </linearGradient>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="57" />
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="4898" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer><feFuncA type="linear" slope="0.09" /></feComponentTransfer>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#base)" />
  <g filter="url(#soften)">
      <circle cx="717" cy="411" r="516" fill="#e9f0c6" opacity="0.62" />
      <circle cx="236" cy="111" r="249" fill="#cfdc9c" opacity="0.54" />
      <circle cx="524" cy="443" r="438" fill="#9fb06d" opacity="0.53" />
      <circle cx="485" cy="15" r="538" fill="#e9f0c6" opacity="0.48" />
      <circle cx="557" cy="456" r="322" fill="#cfdc9c" opacity="0.26" />
  </g>
  <rect width="800" height="800" filter="url(#grain)" />
  <rect width="800" height="800" fill="#22261b" opacity="0.04" />
</svg>
