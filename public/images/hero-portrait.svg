<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 900 1100" role="img" aria-label="Guest during a facial consultation">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#f0dcc8" />
      <stop offset="55%" stop-color="#e2bfa2" />
      <stop offset="100%" stop-color="#c99a79" />
    </linearGradient>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="79" />
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="13" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer><feFuncA type="linear" slope="0.09" /></feComponentTransfer>
    </filter>
  </defs>
  <rect width="900" height="1100" fill="url(#base)" />
  <g filter="url(#soften)">
      <circle cx="510" cy="396" r="365" fill="#f0dcc8" opacity="0.27" />
      <circle cx="33" cy="7" r="375" fill="#e2bfa2" opacity="0.39" />
      <circle cx="502" cy="958" r="655" fill="#c99a79" opacity="0.55" />
      <circle cx="262" cy="183" r="608" fill="#f0dcc8" opacity="0.40" />
      <circle cx="520" cy="677" r="391" fill="#e2bfa2" opacity="0.51" />
  </g>
  <rect width="900" height="1100" filter="url(#grain)" />
  <rect width="900" height="1100" fill="#22261b" opacity="0.04" />
</svg>
